global
  maxconn 4096 # Total Max Connections. This is dependent on ulimit
  #user   haproxy
  #group  haproxy
  #chroot /var/run/haproxy
  nbproc 1

defaults
  mode http

frontend all 0.0.0.0:3001
  timeout client 86400000
  default_backend www_backend
  acl is_websocket hdr(Upgrade) -i WebSocket
  acl is_websocket hdr_beg(Host) -i ws
  use_backend node_backend if is_websocket

backend www_backend
  balance roundrobin
  option forwardfor # This sets X-Forwarded-For
  option httpclose
  timeout server 30000
  timeout connect 4000
  server server1 localhost:8080 weight 1 maxconn 1024 check
  #server server2 localhost:8081 weight 1 maxconn 1024 check
  #server server3 localhost:8082 weight 1 maxconn 1024 check

backend node_backend
  balance roundrobin
  option forwardfor # This sets X-Forwarded-For
  option httpclose
  timeout queue 5000
  timeout server 86400000
  timeout connect 86400000
  server server1 localhost:4000 weight 1 maxconn 1024 check
  #server server2 localhost:4001 weight 1 maxconn 1024 check
  #server server3 localhost:4002 weight 1 maxconn 1024 check

