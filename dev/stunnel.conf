;chroot = /var/lib/stunnel4/
; Chroot jail can be escaped if setuid option is not used
;setuid = stunnel4
;setgid = stunnel4
;pid = /stunnel4.pid
pid = /var/run/stunnel4/stunnel.pid
cert = /etc/stunnel/development.pem
;key = /usr/local/etc/stunnel/cert/server.key
options = NO_SSLv2
;foreground = yes

[https]
  accept  = 5001
  connect = 3001
  TIMEOUTclose = 0

